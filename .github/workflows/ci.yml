name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --frozen
      - name: Tests (synthetic log, fake model client; no network, no API key)
        run: uv run pytest -q
      - name: Full pipeline on the synthetic log
        run: make dev
