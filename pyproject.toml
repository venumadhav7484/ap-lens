[project]
name = "ap-lens"
version = "0.1.0"
description = "A forward-deployed-style case study: blocked-invoice triage agent on the BPI Challenge 2019 log, evaluated against human decisions."
readme = "README.md"
authors = [
    { name = "venumadhav7484", email = "venu.arremsetty@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "duckdb>=2.0.0",
    "fastapi>=0.162.0",
    "langgraph>=1.2.17",
    "lightgbm>=4.7.0",
    "lxml>=6.1.3",
    "mcp>=2.3.0",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "scikit-learn>=1.9.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
ap-lens = "ap_lens:main"
ap-lens-mcp = "ap_lens.mcp_server:main"

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["tests"]
